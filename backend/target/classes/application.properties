# =====================================================================
# Gala Baobab — configuration Spring Boot
# =====================================================================

server.port=${PORT:8080}

# Base H2 persistée sur disque (fichier ./data/gala-db.mv.db) — pas besoin
# d'installer une base de données séparée. Le dossier est créé automatiquement.
spring.datasource.url=jdbc:h2:file:./data/gala-db;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# Console H2 utile en développement (http://localhost:8080/h2-console) —
# à désactiver en production (voir README, section "Sécurité").
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# Clé d'accès à l'espace organisateur — CHANGEZ-LA avant le jour J.
gala.admin-key=${ADMIN_KEY:baobab2026}

# Date de l'événement (ISO-8601, exposée par /api/config)
gala.event-date=${EVENT_DATE:2026-08-08T18:00:00}

# Sert le frontend React (build copié dans src/main/resources/static)
spring.web.resources.static-locations=classpath:/static/

logging.level.com.baobab.gala=INFO
