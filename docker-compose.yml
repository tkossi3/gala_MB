services:
  gala:
    build:
      context: .
      dockerfile: Dockerfile
    image: gala-baobab:latest
    container_name: gala-baobab
    ports:
      - "8080:8080"
    environment:
      # ⚠️ Changez cette clé avant le jour du Gala.
      ADMIN_KEY: "baobab2026"
      EVENT_DATE: "2026-08-09T19:00:00"
    volumes:
      # Persiste la base de votes même si le conteneur est recréé.
      - gala-data:/app/backend/data
    restart: unless-stopped

volumes:
  gala-data:
